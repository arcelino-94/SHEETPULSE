<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrediFlow Analytics PWA - Acompanhamento de Vendas</title>
    <meta name="description" content="PWA em tempo real com dashboards dinâmicos, filtros avançados e IA Gemini para acompanhamento de vendas, assessoria e comissões da planilha Google Sheets." />
    <meta property="og:title" content="CrediFlow Analytics PWA - Acompanhamento de Vendas" />
    <meta property="og:description" content="PWA em tempo real com dashboards dinâmicos, filtros avançados e IA Gemini para acompanhamento de vendas, assessoria e comissões da planilha Google Sheets." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CrediFlow" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('Network script chunk load error detected. Recovering...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var r of regs) r.unregister();
            });
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root">
      <div style="min-height: 100vh; background-color: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
        <div style="width: 40px; height: 40px; border: 3px solid #1e293b; border-top-color: #06b6d4; border-radius: 50%; animation: cf-spin 0.8s linear infinite;"></div>
        <div style="margin-top: 16px; font-size: 14px; font-weight: 700; color: #f8fafc; letter-spacing: 0.05em; text-transform: uppercase;">Lívia Cred 2026</div>
        <div style="margin-top: 6px; font-size: 12px; color: #64748b;">Inicializando sistema financeiro...</div>
      </div>
      <style>
        @keyframes cf-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
