<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing Accent Circle -->
  <circle cx="360" cy="150" r="100" fill="url(#neonGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Central Dynamic Metric / Analytics Shape -->
  <g transform="translate(64, 76)">
    <!-- Bar charts -->
    <rect x="40" y="240" width="48" height="120" rx="12" fill="#334155"/>
    <rect x="116" y="180" width="48" height="180" rx="12" fill="#0ea5e9" opacity="0.85"/>
    <rect x="192" y="120" width="48" height="240" rx="12" fill="#10b981"/>
    <rect x="268" y="70" width="48" height="290" rx="12" fill="url(#neonGrad)" filter="url(#glow)"/>

    <!-- Upward Trend Line -->
    <path d="M 64 220 Q 140 160, 216 110 T 300 50" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Sparkle / Arrow Head -->
    <circle cx="300" cy="50" r="14" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="300" cy="50" r="8" fill="#10b981"/>

    <!-- Currency / Flow Badge -->
    <g transform="translate(230, 240)">
      <rect width="130" height="54" rx="27" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
      <text x="65" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#10b981" text-anchor="middle">R$ LIVE</text>
    </g>
  </g>
</svg>
